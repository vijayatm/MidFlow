name: Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select release version
        id: release
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $projectPath = "src/MidFlow.App/MidFlow.App.csproj"
          $currentContent = Get-Content -LiteralPath $projectPath -Raw
          $currentMatch = [regex]::Match($currentContent, '<Version>\s*(?<version>\d+\.\d+\.\d+)\s*</Version>')
          if (-not $currentMatch.Success) {
            throw "Could not find a stable application version in $projectPath."
          }
          $currentVersion = $currentMatch.Groups['version'].Value

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $latestTag = @(git tag --list 'v*' --sort=-version:refname) | Select-Object -First 1
            if (-not $latestTag -or $latestTag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Manual release requires at least one existing vMAJOR.MINOR.PATCH tag."
            }
            $releaseVersion = $latestTag.Substring(1)
            Write-Host "Manual release selected existing version $releaseVersion from tag $latestTag."
          }
          else {
            $versionChanged = $true
            if ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              $previousContent = git show "$($env:BEFORE_SHA):$projectPath"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not read $projectPath from the previous commit $env:BEFORE_SHA."
              }
              $previousMatch = [regex]::Match(($previousContent -join "`n"), '<Version>\s*(?<version>\d+\.\d+\.\d+)\s*</Version>')
              $versionChanged = -not $previousMatch.Success -or $previousMatch.Groups['version'].Value -ne $currentVersion
            }

            if (-not $versionChanged) {
              Write-Host "No application version change detected; skipping release."
              "should_release=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            }

            $releaseVersion = $currentVersion
            Write-Host "Version bump detected; releasing version $releaseVersion."
          }

          "version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "should_release=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release build tools
        if: steps.release.outputs.should_release == 'true'
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $sdks = dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) {
            throw "The self-hosted runner needs the .NET 10 SDK installed machine-wide."
          }
          $compilerPaths = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe")
          )
          if (-not ($compilerPaths | Where-Object { Test-Path -LiteralPath $_ })) {
            throw "Install Inno Setup 6 or 7 machine-wide on the runner before publishing releases."
          }

      - name: Build release assets
        if: steps.release.outputs.should_release == 'true'
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/package-release.ps1

      - name: Publish GitHub Release assets
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MidFlow v${{ steps.release.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            artifacts/MidFlow-Setup-x64.exe
            artifacts/MidFlow-win-x64.zip
