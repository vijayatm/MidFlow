name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        run: >-
          dotnet publish .\src\MidFlow.App\MidFlow.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\artifacts\win-x64

      - name: Create downloadable package
        run: Compress-Archive -Path .\artifacts\win-x64\* -DestinationPath .\artifacts\MidFlow-win-x64.zip

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .\artifacts\MidFlow-win-x64.zip
