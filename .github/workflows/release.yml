name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup.7 --exact --version 7.1.0 --silent --accept-package-agreements --accept-source-agreements

      - name: Validate release tag and package assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH (for example, v7.1.7). Got: $env:RELEASE_TAG"
          }
          "APP_VERSION=$($Matches.version)" >> $env:GITHUB_ENV
          ./scripts/package-release.ps1

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MidFlow-Setup-x64.exe
            artifacts/MidFlow-win-x64.zip
