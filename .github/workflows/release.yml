name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release build tools
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $sdks = dotnet --list-sdks
          if (-not ($sdks -match '^10\.')) {
            throw "The self-hosted runner needs the .NET 10 SDK installed machine-wide."
          }
          $compilerPaths = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe")
          )
          if (-not ($compilerPaths | Where-Object { Test-Path -LiteralPath $_ })) {
            throw "Install Inno Setup 7 machine-wide on the runner before publishing releases."
          }

      - name: Validate release tag and package assets
        shell: powershell -ExecutionPolicy Bypass -File {0}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH (for example, v7.1.7). Got: $env:RELEASE_TAG"
          }
          $env:APP_VERSION = $Matches.version
          "APP_VERSION=$env:APP_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ./scripts/package-release.ps1

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MidFlow-Setup-x64.exe
            artifacts/MidFlow-win-x64.zip
